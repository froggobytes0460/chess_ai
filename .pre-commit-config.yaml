repos:
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.6.1
    hooks:
      - id: clang-format
        args: [--style=file, --version=22]
        files: \.(cpp|hpp|h)$
      - id: clang-tidy
        args: [--version=22, --jobs=4]
        files: \.(cpp|hpp|h)$
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        files: (CMakeLists\.txt|\.cmake)$
      - id: cmake-lint
        args: [--disabled-codes=C0103]
        files: (CMakeLists\.txt|\.cmake)$
